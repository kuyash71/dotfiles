# FONT SETTINGS
font_family JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
font_size        11

# GENERAL SETTINGS
alt_send_esc no
copy_on_select yes
enable_audio_bell no
cursor_shape beam
cursor_blink_interval 0
confirm_os_window_close 0

# MAPPINGS

# NEW TABS
map ctrl+shift+n new_tab
map ctrl+shift+up new_tab
map ctrl+shift+down close_tab
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab

# SPLIT WINDOWS

map alt+shift+h launch --location=hsplit --cwd=current
map alt+shift+v launch --location=vsplit --cwd=current
map alt+shift+w close_window

map alt+shift+left  neighboring_window left
map alt+shift+right neighboring_window right
map alt+shift+up    neighboring_window up
map alt+shift+down  neighboring_window down

# WINDOW SETTINGS
window_padding_width 11
background_opacity 0.85
background_blur 50

# BEGIN_KITTY_THEME
# kanagawabones
include current-theme.conf
# END_KITTY_THEME
window_padding_height 2
