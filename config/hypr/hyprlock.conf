# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/wallpapers/drake.png
    #blur_passes = 2
    #contrast = 0.8916
    #brightness = 0.7172
    #vibrancy = 0.1696
    #vibrancy_darkness = 0.0
}

# BEYAZ TRANSAPAN SOL PANEL
shape {
    monitor =
    size = 700, 100% # Sütun genişliği
    color = rgba(0, 0, 0, 0.65) # Beyaz ve yüksek oranda saydam (0.15)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = left
    valign = center
    zindex = -1 # Metinlerin ve profil fotoğrafının arkasında kalması için
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# GREETINGS
label {
    monitor =
    text =Welcome!
    color = rgba(205, 214, 224, .75)
    font_size = 55
    font_family = JetBrainsMono Nerd Font
    position = 165, 320
    halign = left
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(205, 214, 224, .75)
    font_size = 40
    font_family = JetBrainsMono Nerd Font
    position = 255, 240
    halign = left
    valign = center


    shadow_passes = 1        # Gölgenin yoğunluğu (0 kapalı demektir, 1-3 arası idealdir)
    shadow_size = 1
    shadow_size = 10         # Gölgenin yayılma boyutu
    shadow_color = rgb(0,0,0)# Gölgenin rengi (siyah genelde en iyisidir)
    shadow_boost = 0.5
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:60000] echo "<span>$(date +"%A, %B %d")</span>"
    color = rgba(205, 214, 224, .75)
    font_size = 20
    text_align = left
    font_family = JetBrainsMono Nerd Font
    position = 210, 175
    halign = left
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = ~/.config/hypr/pfp.webp
    border_size = 1
    border_color = rgba(137, 180, 250, .75)
    size = 160
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 249, 25
    halign = left
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = rgba(255, 255, 255, 0.2)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 170, -140
    halign = left
    valign = center
}

# USER
label {
    monitor =
    text =  $USER
    color = rgba(205, 214, 224, 0.80)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 281, -140
    halign = left
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##ffffff99">󰌋  Password</span></i>
    hide_input = false
    position = 170, -220
    halign = left
    valign = center
}