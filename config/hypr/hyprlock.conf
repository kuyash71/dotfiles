# kvara — kilit ekranı (Lavanta & Altın)
# Control Panel ile aynı palet: lavanta #63537a / #957fb8, altın #e5c283,
# krem #FFF8E7, cam rgba(17,17,27,…). SDDM giriş ekranı da bu tasarımı izliyor.
# Koordinatlar ekranın ortasına göre (y yukarı pozitif), monitör 1536x864 mantıksal.
# Saat + kart sol sütunda (merkezi x = -470); kale sağda net kalıyor.

$font  = CommitMono Nerd Font
$cream = rgba(255, 248, 231, 1.0)
$gold  = rgba(229, 194, 131, 1.0)
$lav   = rgba(149, 127, 184, 1.0)
$lavd  = rgba(99, 83, 122, 1.0)
$col   = -470

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 4, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

# --- Arka plan: blur yok; sol taraf hafif karartılmış kopya (scripts/lock-bg.py) ---
background {
    monitor =
    path = ~/.config/hypr/lock-bg.png
    blur_passes = 0
}

# --- Saat ---
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $cream
    font_size = 92
    font_family = $font Bold
    position = $col, 285
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(17, 17, 27, 0.3)
}

# --- Tarih ---
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='4096'>$(LC_TIME=tr_TR.UTF-8 date +'%A · %-d %B')</span>"
    color = $gold
    font_size = 14
    font_family = $font
    position = $col, 208
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(17, 17, 27, 0.3)
}

# --- Cam kart (avatar + isim + şifre) ---
shape {
    monitor =
    size = 380, 342
    color = rgba(17, 17, 27, 0.55)
    rounding = 28
    border_size = 2
    border_color = rgba(149, 127, 184, 1.0) rgba(229, 194, 131, 1.0) 45deg
    position = $col, -36
    halign = center
    valign = center
    zindex = -1
}

# --- Avatar ---
image {
    monitor =
    path = ~/.config/hypr/avatar.png
    size = 130
    rounding = -1
    border_size = 3
    border_color = rgba(229, 194, 131, 1.0) rgba(149, 127, 184, 1.0) 45deg
    position = $col, 36
    halign = center
    valign = center
}

# --- Kullanıcı ---
label {
    monitor =
    text = $USER
    color = $gold
    font_size = 18
    font_family = $font Bold
    position = $col, -62
    halign = center
    valign = center
}

# --- Bilgisayar ---
label {
    monitor =
    text = <span letter_spacing='2048'>󰖙 kvara</span>
    color = $lav
    font_size = 11
    font_family = $font
    position = $col, -89
    halign = center
    valign = center
}

# --- Şifre ---
input-field {
    monitor =
    size = 300, 50
    position = $col, -148
    halign = center
    valign = center

    rounding = -1
    outline_thickness = 2
    outer_color = rgba(149, 127, 184, 0.45)
    inner_color = rgba(30, 30, 46, 0.6)
    font_color = $cream
    font_family = $font
    check_color = $gold
    fail_color = rgba(243, 139, 168, 1.0)
    capslock_color = $gold

    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false

    placeholder_text = <span foreground="##957fb8">󰌾   Şifre</span>
    fail_text = <span foreground="##f38ba8">Yanlış şifre · $ATTEMPTS</span>
    fail_timeout = 2000
    shadow_passes = 0
}

# --- Alt satır: klavye düzeni · pil ---
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $lav
    font_size = 11
    font_family = $font
    position = -515, 36
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(17, 17, 27, 0.7)
}

label {
    monitor =
    text = cmd[update:30000] b=/sys/class/power_supply/BAT1; c=$(cat $b/capacity); [ "$(cat $b/status)" = Charging ] && i=󰂄 || i=󰁹; echo "$i  $c%"
    color = $lav
    font_size = 11
    font_family = $font
    position = -425, 36
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(17, 17, 27, 0.7)
}
