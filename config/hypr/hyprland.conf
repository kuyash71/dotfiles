################
### MONITORS ###
################

monitor= eDP-1, 1920x1080@144, 0x0, 1.25
monitor= DP-1, 1920x1080@60, 1536x0, 1.25

###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun -show-icons

#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_MENU_PREFIX
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_MENU_PREFIX
exec-once = kbuildsycoca6
exec-once = swww-daemon
exec-once = waypaper --restore
exec-once = waybar
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprpolkitagent
exec-once = ~/.config/hypr/scripts/start-mcontrolcenter.sh
exec-once = flatpak run app.zen_browser.zen
exec-once = wl-paste --type text --watch cliphist --max-items 200 store
exec-once = wl-paste --type image --watch cliphist --max-items 50 store

exec-once = mullvad lockdown-mode set off
exec-once = swaync
exec-once = swayosd-server

exec-once = gnome-keyring-daemon --start --components=secrets

exec-once = hyprctl setcursor Bibata-Modern-Classic 20

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,20

env = QT_QPA_PLATFORMTHEME,qt6ct
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XDG_MENU_PREFIX,arch-

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 10

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(b4befeaa) rgba(eec41a77) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.98

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        ignore_opacity = true
        noise = 0.0
        contrast = 1.1
        xray=false
        new_optimizations = true

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}


# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

cursor {
    no_hardware_cursors = true
}

input {
    kb_layout = tr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.4 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

gesture = 2, horizontal, workspace

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, SPACE, exec, $terminal
bind = CTRL SHIFT, Z, exec, flatpak run app.zen_browser.zen
bind = CTRL, W, killactive,
bind = CTRL, SPACE, exec, $fileManager
bind = $mainMod, TAB, togglefloating,
bind = ALT, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindlef
bind = $mainMod, B, exec, killall -SIGURS2 waybar
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, O, togglefloating,

bind = $mainMod, V, exec, ~/.config/hypr/scripts/clipboard.sh
bind = $mainMod, N, exec, swaync-client -t -sw          # Bildirim merkezi
bind = $mainMod SHIFT, N, exec, swaync-client -d -sw    # Rahatsız Etme

# Example special workspace (scratchpad)
bind = $mainMod, T, togglespecialworkspace, magic
bind = $mainMod SHIFT, T, movetoworkspace, special:magic

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- HYPRSHOT KISAYOLLARI ---

bind = , PRINT, exec, hyprshot -m output
bind = $mainMod, PRINT, exec, hyprshot -m window
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o ~/Documents/HyprShot


# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
# SwayOSD: değişikliği yapar ve ekranda gösterge çıkarır
bindel = ,XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/osd.sh --output-volume raise --max-volume 100
bindel = ,XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/osd.sh --output-volume lower
bindel = ,XF86AudioMute, exec, ~/.config/hypr/scripts/osd.sh --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, ~/.config/hypr/scripts/osd.sh --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/osd.sh --brightness raise
bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/osd.sh --brightness lower
bindr = , Caps_Lock, exec, ~/.config/hypr/scripts/osd.sh --caps-lock

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# --- Rofi Blur Kuralı ---
layerrule {
    name = rofi-blur
    match:namespace = rofi
    blur = on
}

# --- SwayNC: kontrol paneli (blur + sağdan içeri kayar) ---
layerrule {
    name = swaync-panel
    match:namespace = swaync-control-center
    blur = on
    ignore_alpha = 0.3
    animation = slide right
}

# --- SwayNC: açılır bildirimler ---
layerrule {
    name = swaync-popups
    match:namespace = swaync-notification-window
    blur = on
    ignore_alpha = 0.3
}

# --- SwayOSD: ses/parlaklık göstergesi (blur yok, bkz. swayosd/style.css) ---
layerrule {
    name = swayosd
    match:namespace = swayosd
    animation = popin 90%
}

# --- Waybar Pop-up Kuralları ---

xwayland {
  force_zero_scaling = true
}

# Monitor 1 (eDP-1) - Sol Ekran
workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1

# Monitor 2 (DP-1) - Sağ Ekran
workspace = 4, monitor:DP-1, default:true
workspace = 6, monitor:DP-1
workspace = 5, monitor:DP-1

# --- Gsimplecal (Takvim) İçin Modern Blok ---
windowrule {
    name = gsimplecal-fix
    match:class = ^(gsimplecal)$

    float = yes
    pin = yes
    move = cursor -50% 5%
    # stayfocused hata verdiği için kaldırıldı, Hyprland odağı artık otomatik yönetiyor.
}

windowrule {
    name = waybar-popups-small
    match:class = .*(pavucontrol|nm-connection-editor|blueman-manager).*
    
    float = yes
    center = on
    size = 400 500
}

windowrule {
    name = waybar-popups-large
    match:class = ^(missioncenter)$
    
    float = yes
    center = on
    size = 700 600
}

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}



# TeamViewer (XWayland) diyalogları ekran dışı koordinatlarda doğuyor.
# Parola penceresi görünmeyince bağlantı "Authenticating"de asılı kalıyor.
windowrule {
    name = teamviewer-dialogs-center

    match:class = ^(TeamViewer)$
    match:title = ^(TeamViewer Authentication)$

    float = yes
    center = on
}
